<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xtreme AG Apps | Sign In</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f7fb;font-family:system-ui,sans-serif;color:#111827}.card{width:min(440px,100%);background:white;border:1px solid #e5e7eb;border-radius:24px;padding:32px;box-shadow:0 18px 60px #0f172a18;text-align:center}.logo{font-size:22px;font-weight:800;margin-bottom:28px}.logo span{color:#2563eb}h1{margin:0 0 8px}p{color:#64748b;line-height:1.5}.google{width:100%;margin-top:22px;padding:14px;border:1px solid #d1d5db;border-radius:12px;background:white;font-size:16px;font-weight:700;cursor:pointer}.google:disabled{opacity:.6}.status{display:none;margin-top:16px;padding:12px;border-radius:10px;background:#fef2f2;color:#b91c1c;text-align:left;font-size:14px}.note{margin-top:20px;font-size:13px;color:#94a3b8}</style></head><body>
<main class="card"><div class="logo">Xtreme <span>AG Apps</span></div><h1>Welcome back</h1><p>Sign in with Google. First-time users will enter their name and mobile number.</p><button id="google" class="google">Continue with Google</button><div id="status" class="status"></div><div class="note">One account for Xtreme AG Apps services.</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const supabase=window.supabase.createClient("https://vbfjafblxnrfminbdlbb.supabase.co","sb_publishable_B1zX6LJONSD6icwsbHVmYg_z8qpprk9",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
function err(m){const e=document.getElementById("status");e.textContent=m;e.style.display="block";}
async function route(session){if(!session)return;const {data:p,error}=await supabase.from("profiles").select("display_name,mobile,is_admin").eq("id",session.user.id).maybeSingle();if(error){err("Profile check failed: "+error.message);document.getElementById("google").disabled=false;return;}if(!p||!p.display_name||!p.mobile){location.replace("./complete-profile.html");return;}if(p.is_admin===true){location.replace("./admin.html");}else{location.replace("./test-portal.html");}}
document.getElementById("google").onclick=async()=>{const b=document.getElementById("google");b.disabled=true;b.textContent="Connecting...";const {error}=await supabase.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+"/auth.html",queryParams:{prompt:"select_account"}}});if(error){err(error.message);b.disabled=false;b.textContent="Continue with Google";}};
supabase.auth.onAuthStateChange((e,s)=>{if(e==="SIGNED_IN"&&s)setTimeout(()=>route(s),0);});
(async()=>{const {data:{session}}=await supabase.auth.getSession();if(session)route(session);})();
</script></body></html>
