<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign In | Xtreme Exam</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--text:#172033;--muted:#687386;--line:#e3e8f0;--brand:#1769e0;--danger:#b42318;--ok:#087443}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:min(460px,100%);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 18px 55px #1e325018}.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px;text-decoration:none;color:inherit}.logo{width:46px;height:46px;border-radius:13px;background:#172033;color:#fff;display:grid;place-items:center;font-weight:900;font-size:23px}.brand strong{font-size:19px}.brand span{display:block;color:var(--muted);font-size:12px}h1{font-size:29px;margin:0 0 7px}.sub{color:var(--muted);margin:0 0 23px;font-size:14px}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#f0f3f7;border-radius:12px;padding:4px;margin-bottom:22px}.tab{border:0;background:transparent;padding:11px;border-radius:9px;font-weight:700;color:var(--muted);cursor:pointer}.tab.active{background:#fff;color:var(--text);box-shadow:0 2px 8px #00000012}label{display:block;font-size:13px;font-weight:700;margin:14px 0 7px}input{width:100%;padding:13px 14px;border:1px solid #d8dee8;border-radius:11px;font-size:15px;outline:0}input:focus{border-color:var(--brand);box-shadow:0 0 0 3px #1769e01a}.primary{width:100%;border:0;border-radius:11px;background:var(--brand);color:#fff;padding:14px;font-weight:800;font-size:15px;cursor:pointer;margin-top:20px}.links{margin-top:15px;font-size:13px}.link{border:0;background:none;color:var(--brand);cursor:pointer;font-weight:700}.msg{display:none;margin-top:15px;padding:11px 13px;border-radius:10px;font-size:13px;line-height:1.45}.msg.show{display:block}.msg.error{background:#fff0ee;color:var(--danger);border:1px solid #ffd2cc}.msg.ok{background:#ecfdf3;color:var(--ok);border:1px solid #b7ebcb}.note{margin-top:19px;color:var(--muted);font-size:12px;line-height:1.55;text-align:center}.hidden{display:none!important}@media(max-width:500px){.card{padding:24px 18px}h1{font-size:25px}}
</style></head><body><main class="card">
<a class="brand" href="./"><div class="logo">X</div><div><strong>Xtreme Exam</strong><span>Test Series & Study Platform</span></div></a>
<h1 id="title">Sign In</h1><p class="sub" id="subtitle">Mobile number aur password se login karein.</p>
<div class="tabs"><button class="tab active" id="signinTab">Sign In</button><button class="tab" id="signupTab">Create Account</button></div>
<section id="signinForm"><label>Mobile Number</label><input id="loginMobile" inputmode="numeric" maxlength="10" placeholder="10 digit mobile number"><label>Password</label><input id="loginPassword" type="password" placeholder="Password"><button class="primary" id="signinBtn">Sign In</button><div class="links"><button class="link" id="forgotBtn">Forgot Password?</button></div></section>
<section id="signupForm" class="hidden"><label>Full Name</label><input id="signupName" placeholder="Your full name"><label>Mobile Number</label><input id="signupMobile" inputmode="numeric" maxlength="10" placeholder="10 digit mobile number"><label>Password</label><input id="signupPassword" type="password" placeholder="Minimum 6 characters"><button class="primary" id="signupBtn">Create Account</button></section>
<div id="msg" class="msg"></div><p class="note">No OTP. Passwords are handled by Supabase Auth and are not visible to administrators.</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=window.supabase.createClient('https://vbfjafblxnrfminbdlbb.supabase.co','sb_publishable_B1zX6LJONSD6icwsbHVmYg_z8qpprk9',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id), mob=v=>(v||'').replace(/\D/g,'').slice(-10), email=m=>mob(m)+'@exam.xtremeagapps.in';
function msg(t,c='error'){$('msg').textContent=t;$('msg').className='msg show '+c}function clear(){ $('msg').className='msg' }function valid(m){return /^[6-9]\d{9}$/.test(m)}
async function route(){const {data:{user}}=await sb.auth.getUser();if(!user)return msg('Session verify nahi ho saki.');const {data:p,error}=await sb.from('profiles').select('display_name,mobile,is_admin').eq('id',user.id).maybeSingle();if(error)return msg('Profile load failed: '+error.message);if(!p)return msg('Profile nahi mila.');location.replace(p.is_admin?'./admin.html':'./test-portal.html')}
$('signinTab').onclick=()=>{ $('signinTab').classList.add('active');$('signupTab').classList.remove('active');$('signinForm').classList.remove('hidden');$('signupForm').classList.add('hidden');$('title').textContent='Sign In';$('subtitle').textContent='Mobile number aur password se login karein.';clear()};
$('signupTab').onclick=()=>{ $('signupTab').classList.add('active');$('signinTab').classList.remove('active');$('signupForm').classList.remove('hidden');$('signinForm').classList.add('hidden');$('title').textContent='Create Account';$('subtitle').textContent='Apna account banakar Test Portal access karein.';clear()};
$('signinBtn').onclick=async()=>{clear();let m=mob($('loginMobile').value),p=$('loginPassword').value;if(!valid(m))return msg('Valid 10 digit mobile number enter karein.');if(!p)return msg('Password enter karein.');let b=$('signinBtn');b.disabled=true;b.textContent='Signing in…';try{let {error}=await sb.auth.signInWithPassword({email:email(m),password:p});if(error)throw error;await route()}catch(e){msg(e.message||'Login failed.')}finally{b.disabled=false;b.textContent='Sign In'}};
$('signupBtn').onclick=async()=>{clear();let n=$('signupName').value.trim(),m=mob($('signupMobile').value),p=$('signupPassword').value;if(n.length<2)return msg('Full name enter karein.');if(!valid(m))return msg('Valid 10 digit mobile number enter karein.');if(p.length<6)return msg('Password minimum 6 characters ka hona chahiye.');let b=$('signupBtn');b.disabled=true;b.textContent='Creating…';try{let {data,error}=await sb.auth.signUp({email:email(m),password:p,options:{data:{display_name:n,mobile:m}}});if(error)throw error;if(!data.user)throw Error('Account create nahi ho saka.');let r=await sb.from('profiles').upsert({id:data.user.id,display_name:n,mobile:m,is_admin:false,updated_at:new Date().toISOString()},{onConflict:'id'});if(r.error)throw r.error;if(data.session){msg('Account create ho gaya.','ok');await route()}else msg('Account create ho gaya, lekin Confirm Email ON hai. Use OFF karna hoga.')}catch(e){msg(e.message||'Account creation failed.')}finally{b.disabled=false;b.textContent='Create Account'}};
$('forgotBtn').onclick=()=>{let m=mob($('loginMobile').value);let t=encodeURIComponent('Exam Portal password reset request. Registered mobile: '+(m||'Not entered'));window.open('https://wa.me/918698?text='+t,'_blank')};
</script></body></html>
