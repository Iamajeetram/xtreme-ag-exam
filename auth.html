<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign In | Xtreme Exam</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0b0b0d;color:#fff;font-family:Arial,Helvetica,sans-serif;display:grid;place-items:center;padding:20px}
.card{width:min(440px,100%);background:#151519;border:1px solid #292930;border-radius:24px;padding:34px 24px;text-align:center;box-shadow:0 20px 70px #0008}
.mark{width:48px;height:48px;border:2px solid #d4af37;border-radius:14px;display:grid;place-items:center;margin:0 auto 12px;color:#f5d76e;font-weight:900;font-size:22px}
.logo{font-weight:800;font-size:20px;margin-bottom:34px}.logo span{color:#d4af37}
h1{font-size:30px;margin:0 0 10px}.sub{color:#aaa;line-height:1.6;margin:0 auto 28px}
.google{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border:1px solid #ddd;border-radius:12px;background:#fff;color:#222;font-size:16px;font-weight:700;text-decoration:none;cursor:pointer;gap:10px}
.google:active{transform:scale(.99)}.g{font-size:21px;font-weight:900;color:#4285f4}
.status{display:none;margin-top:18px;padding:13px;border-radius:10px;background:#171f2b;border:1px solid #31435c;color:#bcd4f5;font-size:14px;line-height:1.45;word-break:break-word}
</style>
</head>
<body>
<main class="card">
<div class="mark">X</div>
<div class="logo">Xtreme <span>AG Apps</span></div>
<h1>Welcome back</h1>
<p class="sub">Sign in with your Google account to access Xtreme Exam.</p>

<!-- DIRECT OAUTH LINK: no JS click handler required -->
<a id="googleLogin" class="google" href="#">
  <span class="g">G</span>
  <span>Continue with Google</span>
</a>

<div id="status" class="status"></div>
</main>

<script>
const SUPABASE_URL = 'https://vbfjafblxnrfminbdlbb.supabase.co';
const REDIRECT_URL = 'https://exam.xtremeagapps.in/auth.html';
const OAUTH_URL =
  SUPABASE_URL + '/auth/v1/authorize?provider=google' +
  '&redirect_to=' + encodeURIComponent(REDIRECT_URL) +
  '&prompt=select_account';

document.getElementById('googleLogin').href = OAUTH_URL;
</script>

<!-- Supabase JS is used ONLY after OAuth returns, not for the button itself. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_KEY = 'sb_publishable_B1zX6LJONSD6icwsbHVmYg_z8qpprk9';
const ADMIN_EMAIL = 'ajeetram3@gmail.com';

function showStatus(message) {
  const el = document.getElementById('status');
  el.textContent = message;
  el.style.display = 'block';
}

async function routeAfterLogin() {
  try {
    if (!window.supabase) {
      showStatus('Login completed, but the authentication library did not load. Please refresh this page once.');
      return;
    }

    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    });

    const result = await client.auth.getSession();
    if (result.error) throw result.error;

    const session = result.data.session;
    if (!session || !session.user) return;

    const email = (session.user.email || '').toLowerCase().trim();

    const profileResult = await client
      .from('profiles')
      .select('display_name,mobile,is_admin')
      .eq('id', session.user.id)
      .maybeSingle();

    if (profileResult.error) throw profileResult.error;

    const profile = profileResult.data;

    if (email === ADMIN_EMAIL && profile && profile.is_admin === true) {
      window.location.replace('./admin.html');
      return;
    }

    if (profile && profile.display_name && profile.mobile) {
      window.location.replace('./test-portal.html');
      return;
    }

    window.location.replace('./complete-profile.html');
  } catch (e) {
    console.error(e);
    showStatus('Login detected, but profile routing failed: ' + (e.message || e));
  }
}

routeAfterLogin();
</script>
</body>
</html>
