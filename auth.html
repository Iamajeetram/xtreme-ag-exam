<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Account | Xtreme AG Apps</title>
<link rel="icon" type="image/png" sizes="512x512" href="./favicon.png">
<link rel="apple-touch-icon" href="./favicon.png">
<style>
:root{--bg:#f6f9fc;--card:#fff;--line:#e4e9f0;--text:#14213d;--muted:#667085;--blue:#2563eb;--blue2:#1d4ed8;--green:#059669;--shadow:0 16px 45px rgba(15,23,42,.08)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,rgba(37,99,235,.10),transparent 30%),linear-gradient(180deg,#fff 0,#f6f9fc 70%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
a{color:inherit;text-decoration:none}button,input{font:inherit}header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.nav{width:min(1180px,92%);margin:auto;min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{font-weight:900;letter-spacing:-.03em;font-size:18px}.brand b{color:var(--blue)}nav{display:flex;gap:18px;font-size:14px;color:#475467}nav a:hover{color:var(--blue)}
.wrap{width:min(1180px,92%);margin:auto}.hero{padding:72px 0 35px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}h1{font-size:clamp(38px,6vw,68px);line-height:1.02;letter-spacing:-.055em;margin:14px 0}h1 span{color:var(--blue)}.lead{max-width:720px;color:var(--muted);font-size:18px;line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;padding:28px 0 75px}.tile{display:block;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:30px;box-shadow:var(--shadow);transition:.2s;position:relative;overflow:hidden}.tile:hover{transform:translateY(-4px);border-color:#b9cdfc}.icon{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:#eef4ff;color:var(--blue);font-size:25px;margin-bottom:22px}.tile h2{margin:0 0 8px;font-size:25px}.tile p{margin:0;color:var(--muted);line-height:1.6}.arrow{position:absolute;right:25px;top:25px;color:var(--blue);font-size:22px}.tag{display:inline-block;margin-top:20px;padding:7px 10px;border-radius:999px;background:#eff6ff;color:var(--blue);font-size:11px;font-weight:800}
.panel{background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:28px}.form{max-width:500px;margin:45px auto 80px}label{display:block;font-size:13px;font-weight:700;margin:16px 0 7px}input{width:100%;padding:13px 14px;border:1px solid #d8dee8;border-radius:12px;background:#fff;color:var(--text);outline:none}input:focus{border-color:#7da2f7;box-shadow:0 0 0 4px #2563eb14}.btn{border:0;border-radius:12px;padding:13px 17px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer}.btn:hover{background:var(--blue2)}.btn.secondary{background:#eef4ff;color:var(--blue)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.msg{margin-top:15px;padding:12px 14px;border-radius:12px;background:#f1f5f9;color:#475467;font-size:14px;display:none}.msg.show{display:block}.muted{color:var(--muted)}.user-table{width:100%;border-collapse:collapse;margin-top:18px}.user-table th,.user-table td{padding:13px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.user-table th{color:#667085;background:#f8fafc}footer{border-top:1px solid var(--line);padding:28px;color:#7b8495;font-size:12px;background:#fff}
@media(max-width:760px){nav{gap:10px}nav a:nth-child(3){display:none}.grid{grid-template-columns:1fr}.hero{padding-top:55px}.tile{padding:24px}}
</style></head>
<body>
<header><div class="nav"><a class="brand" href="./">XTREME <b>AG APPS</b></a><nav><a href="./">Home</a><a href="./?portal=tests">Exam</a><a href="https://xtremeagapps.in/">Main Site</a></nav></div></header>
<main class="wrap"><section class="form panel">
<div class="eyebrow">Test Series Portal</div><h1 style="font-size:42px">Your account <span>first.</span></h1>
<p class="muted">Create an account or sign in to continue. No OTP is required.</p>
<div class="actions"><button class="btn" id="signupTab">Create Account</button><button class="btn secondary" id="signinTab">Sign In</button></div>
<form id="form">
<div id="nameWrap"><label for="name">Full Name</label><input id="name" autocomplete="name"></div>
<label for="mobile">Mobile Number</label><input id="mobile" inputmode="numeric" maxlength="10" autocomplete="tel">
<label for="password">Password</label><input id="password" type="password" autocomplete="new-password">
<div class="actions"><button class="btn" id="submit">Create Account</button><button class="btn secondary" type="button" id="adminBtn">Admin Login</button></div>
</form>
<div class="actions"><a class="btn secondary" href="https://wa.me/919462856389?text=Hello%20Xtreme%20AG%20Apps%2C%20I%20need%20help%20with%20my%20Test%20Portal%20password." target="_blank" rel="noopener">Forgot Password · WhatsApp</a></div>
<div class="msg" id="msg"></div>
</section></main><footer><div class="wrap">Password reset assistance: WhatsApp support · 9462856389</div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://vbfjafblxnrfminbdlbb.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_B1zX6LJONSD6icwsbHVmYg_z8qpprk9';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let mode='signup';
const $=id=>document.getElementById(id);
function message(t){$('msg').textContent=t;$('msg').classList.add('show')}
function setMode(m){mode=m;$('nameWrap').style.display=m==='signup'?'block':'none';$('submit').textContent=m==='signup'?'Create Account':'Sign In';$('signupTab').className='btn '+(m==='signup'?'':'secondary');$('signinTab').className='btn '+(m==='signin'?'':'secondary')}
$('signupTab').onclick=()=>setMode('signup');$('signinTab').onclick=()=>setMode('signin');
$('adminBtn').onclick=()=>location.href='./admin.html';
function mobileEmail(m){return m.replace(/\D/g,'')+'@login.xtremeagapps.in'}
$('form').onsubmit=async e=>{
 e.preventDefault(); $('submit').disabled=true; message('Please wait...');
 const mobile=$('mobile').value.trim(), pass=$('password').value, name=$('name').value.trim();
 if(!/^\d{10}$/.test(mobile)||pass.length<6||(mode==='signup'&&!name)){message('Please enter valid details. Password must be at least 6 characters.');$('submit').disabled=false;return}
 try{
  const email=mobileEmail(mobile);
  if(mode==='signup'){
   const {data,error}=await sb.auth.signUp({email,password:pass,options:{data:{display_name:name,mobile}}});
   if(error)throw error;
   if(!data.user)throw new Error('Account could not be created.');
   const {error:pe}=await sb.from('profiles').upsert({id:data.user.id,display_name:name,mobile,updated_at:new Date().toISOString()},{onConflict:'id'});
   if(pe)throw pe;
   if(!data.session){message('Account created. If Supabase email confirmation is enabled, it must be disabled for this no-OTP mobile login flow.');}
   else location.href='./test-portal.html';
  }else{
   const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
   if(error)throw error;
   const {data:p}=await sb.from('profiles').select('display_name,mobile,is_admin').eq('id',data.user.id).maybeSingle();
   if(p?.is_admin===true) location.href='./admin.html'; else location.href='./test-portal.html';
  }
 }catch(err){message(err.message||'Unable to continue.')} finally{$('submit').disabled=false}
};
</script></body></html>
