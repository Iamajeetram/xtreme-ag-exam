<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Study Notes | Xtreme Exam</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/png" sizes="512x512" href="./favicon.png">
  <link rel="apple-touch-icon" href="./favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f8fafc;
      --line: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --blue: #2563eb;
      --green: #16a34a;
      --gold: #d97706;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }
    button, input { font-family: inherit; }

    .app-top-bar {
      position: sticky;
      top: 0;
      z-index: 80;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      padding: 14px 16px;
    }

    .app-top-inner {
      width: min(860px, 100%);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .app-page-title { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }

    .wrap {
      width: min(860px, 100%);
      margin: 0 auto;
      padding: 16px 16px 30px;
    }

    /* Clean Search Input (Same App Style) */
    .search-box { margin-bottom: 18px; }
    .search-box input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      font-size: 13.5px;
      font-weight: 600;
      outline: none;
    }
    .search-box input:focus { border-color: var(--blue); background: #fff; }

    .nav-crumb-bar {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 10px; margin-bottom: 16px;
    }
    .crumb-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .back-step-btn {
      display: inline-flex; align-items: center; gap: 5px; padding: 7px 12px;
      border-radius: 10px; background: var(--surface); border: 1px solid var(--line);
      color: var(--text); font-size: 12.5px; font-weight: 800; cursor: pointer;
    }
    .section-heading { font-size: 17px; font-weight: 800; }
    .section-sub { font-size: 12px; color: var(--muted); font-weight: 600; }

    /* Unified 2-Column Pastel Tiles (Same as Home & Tests) */
    .tiles-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    @media (min-width: 700px) {
      .tiles-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    .folder-tile {
      border-radius: 18px; padding: 16px 14px; display: flex; flex-direction: column;
      justify-content: space-between; min-height: 132px; cursor: pointer;
      border: 1px solid rgba(15, 23, 42, 0.06); text-align: left;
    }
    .folder-tile.theme-0 { background: linear-gradient(145deg, #eff6ff, #dbeafe); border-color: #bfdbfe; }
    .folder-tile.theme-1 { background: linear-gradient(145deg, #f5f3ff, #ede9fe); border-color: #ddd6fe; }
    .folder-tile.theme-2 { background: linear-gradient(145deg, #f0f9ff, #e0f2fe); border-color: #bae6fd; }
    .folder-tile.theme-3 { background: linear-gradient(145deg, #fff7ed, #ffedd5); border-color: #fed7aa; }

    .tile-ico {
      width: 38px; height: 38px; border-radius: 11px; background: rgba(255, 255, 255, 0.9);
      display: grid; place-items: center; font-size: 19px; margin-bottom: 10px;
    }
    .folder-tile h3 { font-size: 15px; font-weight: 800; line-height: 1.25; margin-bottom: 4px; color: var(--text); }
    .tile-meta { font-size: 11.5px; color: var(--muted); font-weight: 600; }

    /* Clean Notes List */
    .notes-list-stack { display: flex; flex-direction: column; gap: 12px; }
    .note-row {
      background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--blue);
      border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.03);
    }
    .note-row.upcoming-row { border-left-color: var(--gold); }

    .note-badges { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
    .badge { padding: 3px 9px; border-radius: 999px; font-size: 10.5px; font-weight: 800; }
    .badge.subj { background: #eff6ff; color: var(--blue); }
    .badge.free { background: #dcfce7; color: #15803d; }
    .badge.paid { background: #fef3c7; color: #b45309; }
    .badge.soon { background: #fef3c7; color: #b45309; }

    .note-row h3 { font-size: 15.5px; font-weight: 800; margin-bottom: 4px; }
    .note-row p { color: var(--muted); font-size: 13px; line-height: 1.5; }

    .note-actions { display: grid; grid-template-columns: 1.2fr 1fr; gap: 8px; }
    .note-actions.single { grid-template-columns: 1fr; }

    .btn-read {
      padding: 11px 14px; border-radius: 11px; border: 0; background: var(--blue); color: #fff;
      font-weight: 800; font-size: 13px; cursor: pointer; display: inline-flex;
      align-items: center; justify-content: center; gap: 5px;
    }
    .btn-dl {
      padding: 11px 14px; border-radius: 11px; border: 1px solid #cbd5e1; background: var(--surface);
      color: var(--text); font-weight: 800; font-size: 13px; display: inline-flex;
      align-items: center; justify-content: center; gap: 5px;
    }
    .btn-buy {
      padding: 11px 14px; border-radius: 11px; background: #0f172a; color: #fff;
      font-weight: 800; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    }
    .btn-soon { padding: 11px; border-radius: 11px; background: #f1f5f9; color: #64748b; font-weight: 700; font-size: 12.5px; text-align: center; }

    /* Full-Screen In-App PDF Viewer */
    .pdf-modal {
      position: fixed; inset: 0; height: 100dvh; width: 100vw;
      background: #0f172a; z-index: 1000; display: none; flex-direction: column;
    }
    .pdf-modal.open { display: flex; }
    .pdf-modal-bar {
      height: 56px; padding: 0 14px; background: #0f172a; color: #fff;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .pdf-modal-title { flex: 1; min-width: 0; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pdf-top-btn { padding: 7px 12px; border-radius: 8px; font-size: 12px; font-weight: 800; border: 0; cursor: pointer; }
    .pdf-top-btn.dl { background: #10b981; color: #052e16; }
    .pdf-top-btn.close { background: #ef4444; color: #fff; }
    .pdf-frame-wrap { flex: 1; width: 100%; height: 100%; background: #1e293b; }
    .pdf-frame-wrap iframe { width: 100%; height: 100%; border: 0; display: block; }
  </style>
</head>
<body>

  <header class="app-top-bar">
    <div class="app-top-inner">
      <div class="app-page-title">Study Notes & PDFs</div>
    </div>
  </header>

  <main class="wrap">
    <div class="search-box">
      <input id="noteSearchInput" placeholder="🔍 Search notes, subjects, or exams..." oninput="renderNotesView()">
    </div>

    <div class="nav-crumb-bar" id="notesCrumbBar"></div>

    <div id="notesDynamicContainer">
      <div style="text-align:center;padding:40px;color:var(--muted)">Loading study material...</div>
    </div>
  </main>

  <div id="pdfViewerModal" class="pdf-modal">
    <div class="pdf-modal-bar">
      <div class="pdf-modal-title" id="pdfModalTitle">Document Viewer</div>
      <div style="display:flex;gap:8px;flex-shrink:0">
        <a id="pdfModalDownloadBtn" class="pdf-top-btn dl" href="#" target="_blank" rel="noopener">⬇️ Download</a>
        <button type="button" class="pdf-top-btn close" onclick="closePdfViewer()">✕ Close</button>
      </div>
    </div>
    <div class="pdf-frame-wrap">
      <iframe id="pdfIframe" src="about:blank" allow="autoplay"></iframe>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const sb = window.supabase.createClient(
      "https://vbfjafblxnrfminbdlbb.supabase.co",
      "sb_publishable_B1zX6LJONSD6icwsbHVmYg_z8qpprk9"
    );

    const TILE_ICONS = ['📖', '🗂️', '📘', '📑'];
    let allNotes = [];
    let navState = { step: 'exams', examSlug: null, examName: null, subjectName: null };

    function parseDriveLinks(rawUrl) {
      if (!rawUrl) return { previewUrl: '', downloadUrl: '' };
      const url = rawUrl.trim();
      const idMatch = url.match(/\/d\/([a-zA-Z0-9_-]{15,})/) || url.match(/[?&]id=([a-zA-Z0-9_-]{15,})/);
      if (idMatch && idMatch[1]) {
        return {
          previewUrl: `https://drive.google.com/file/d/${idMatch[1]}/preview`,
          downloadUrl: `https://drive.google.com/uc?export=download&id=${idMatch[1]}`
        };
      }
      return { previewUrl: url, downloadUrl: url };
    }

    function openPdfViewer(title, rawUrl) {
      const links = parseDriveLinks(rawUrl);
      if (!links.previewUrl) { alert("PDF link not available yet."); return; }
      document.getElementById('pdfModalTitle').textContent = title;
      document.getElementById('pdfModalDownloadBtn').href = links.downloadUrl;
      document.getElementById('pdfIframe').src = links.previewUrl;
      document.getElementById('pdfViewerModal').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closePdfViewer() {
      document.getElementById('pdfViewerModal').classList.remove('open');
      document.getElementById('pdfIframe').src = 'about:blank';
      document.body.style.overflow = '';
    }

    async function loadNotes() {
      const { data } = await sb.from('exam_notes').select('*').order('created_at', { ascending: true });
      allNotes = data || [];
      renderNotesView();
    }

    function goToExamsStep() { navState = { step: 'exams', examSlug: null, examName: null, subjectName: null }; renderNotesView(); }
    function openExamSubjects(examSlug, examName) {
      const examNotes = allNotes.filter(n => n.exam_slug === examSlug);
      const uniqueSubjects = [...new Set(examNotes.map(n => (n.subject || 'General').trim()))];
      navState = uniqueSubjects.length <= 1
        ? { step: 'list', examSlug, examName, subjectName: uniqueSubjects[0] || null }
        : { step: 'subjects', examSlug, examName, subjectName: null };
      renderNotesView();
    }
    function openSubjectNotes(subjectName) { navState.step = 'list'; navState.subjectName = subjectName; renderNotesView(); }

    function renderNotesView() {
      const crumbBar = document.getElementById('notesCrumbBar');
      const container = document.getElementById('notesDynamicContainer');
      const searchQ = (document.getElementById('noteSearchInput').value || '').toLowerCase().trim();

      if (!allNotes.length) {
        crumbBar.innerHTML = `<div class="section-heading">Study Material</div>`;
        container.innerHTML = `<div style="text-align:center;padding:40px;color:var(--muted)">No study notes uploaded yet.</div>`;
        return;
      }

      if (searchQ) {
        const matched = allNotes.filter(n =>
          (n.title || '').toLowerCase().includes(searchQ) ||
          (n.subject || '').toLowerCase().includes(searchQ) ||
          (n.exam_name || '').toLowerCase().includes(searchQ)
        );
        crumbBar.innerHTML = `<div class="section-heading">Search Results (${matched.length})</div>`;
        container.innerHTML = renderNotesListHTML(matched, true);
        return;
      }

      if (navState.step === 'exams') {
        const examGroups = [];
        allNotes.forEach(n => {
          let g = examGroups.find(x => x.slug === n.exam_slug);
          if (!g) { g = { slug: n.exam_slug, name: n.exam_name, notes: [], subjects: new Set() }; examGroups.push(g); }
          g.notes.push(n);
          if (n.subject) g.subjects.add(n.subject.trim());
        });

        crumbBar.innerHTML = `<div class="crumb-left"><div><div class="section-heading">Exam Categories (${examGroups.length})</div><div class="section-sub">Select an exam to view PDF notes</div></div></div>`;
        container.innerHTML = `
          <div class="tiles-grid">
            ${examGroups.map((g, idx) => `
              <button type="button" class="folder-tile theme-${idx % 4}" onclick="openExamSubjects('${g.slug}', '${g.name.replace(/'/g, "\\'")}')">
                <div class="tile-ico">${TILE_ICONS[idx % TILE_ICONS.length]}</div>
                <div>
                  <h3>${g.name}</h3>
                  <div class="tile-meta">${g.notes.length} PDFs • ${g.subjects.size} Subject${g.subjects.size > 1 ? 's' : ''}</div>
                </div>
              </button>
            `).join('')}
          </div>
        `;
        return;
      }

      if (navState.step === 'subjects') {
        const examNotes = allNotes.filter(n => n.exam_slug === navState.examSlug);
        const subjectGroups = [];
        examNotes.forEach(n => {
          const sName = (n.subject || 'General').trim();
          let sg = subjectGroups.find(x => x.name === sName);
          if (!sg) { sg = { name: sName, notes: [] }; subjectGroups.push(sg); }
          sg.notes.push(n);
        });

        crumbBar.innerHTML = `
          <div class="crumb-left">
            <button type="button" class="back-step-btn" onclick="goToExamsStep()">← Back</button>
            <div><div class="section-heading">${navState.examName}</div><div class="section-sub">${subjectGroups.length} Subjects</div></div>
          </div>
          <button type="button" class="back-step-btn" style="background:var(--blue);color:#fff;border:0" onclick="openSubjectNotes(null)">All ${examNotes.length} PDFs →</button>
        `;
        container.innerHTML = `
          <div class="tiles-grid">
            ${subjectGroups.map((sg, idx) => `
              <button type="button" class="folder-tile theme-${idx % 4}" onclick="openSubjectNotes('${sg.name.replace(/'/g, "\\'")}')">
                <div class="tile-ico">🗂️</div>
                <div>
                  <h3>${sg.name}</h3>
                  <div class="tile-meta">${sg.notes.length} PDF${sg.notes.length > 1 ? 's' : ''}</div>
                </div>
              </button>
            `).join('')}
          </div>
        `;
        return;
      }

      const examNotes = allNotes.filter(n => n.exam_slug === navState.examSlug);
      const uniqueSubjects = [...new Set(examNotes.map(n => (n.subject || 'General').trim()))];
      const listNotes = navState.subjectName ? examNotes.filter(n => (n.subject || 'General').trim() === navState.subjectName) : examNotes;
      const backAction = uniqueSubjects.length > 1 ? `openExamSubjects('${navState.examSlug}', '${navState.examName.replace(/'/g, "\\'")}')` : `goToExamsStep()`;

      crumbBar.innerHTML = `
        <div class="crumb-left">
          <button type="button" class="back-step-btn" onclick="${backAction}">← Back</button>
          <div><div class="section-heading">${navState.subjectName || navState.examName}</div><div class="section-sub">${listNotes.length} PDF${listNotes.length > 1 ? 's' : ''}</div></div>
        </div>
      `;
      container.innerHTML = renderNotesListHTML(listNotes, false);
    }

    function renderNotesListHTML(list, showExamTag) {
      if (!list.length) return `<div style="text-align:center;padding:36px;color:var(--muted)">No matching notes found.</div>`;
      return `
        <div class="notes-list-stack">
          ${list.map((n, idx) => {
            const isLive = n.status === 'live';
            const links = parseDriveLinks(n.file_url);
            const safeTitle = (n.title || 'Study Note').replace(/'/g, "\\'");
            const safeUrl = (n.file_url || '').replace(/'/g, "\\'");
            const waBuyLink = `https://wa.me/917878025556?text=${encodeURIComponent('Hello Sir, mujhe "' + n.title + '" (₹' + n.price + ') Note buy karna hai.')}`;

            return `
              <article class="note-row ${isLive ? '' : 'upcoming-row'}">
                <div>
                  <div class="note-badges">
                    <span class="badge subj">#${idx + 1} • ${showExamTag ? n.exam_name + ' • ' : ''}${n.subject}</span>
                    <span class="badge ${!isLive ? 'soon' : (n.is_free ? 'free' : 'paid')}">
                      ${!isLive ? '⏳ COMING SOON' : (n.is_free ? 'FREE PDF' : '💎 ₹' + n.price)}
                    </span>
                  </div>
                  <h3>${n.title}</h3>
                  <p>${n.description || 'Exam-oriented crisp revision material.'}</p>
                </div>

                <div class="note-actions ${(!isLive || !n.is_free) ? 'single' : ''}">
                  ${!isLive
                    ? `<div class="btn-soon">📅 Available: ${n.available_date || 'Soon'}</div>`
                    : (n.is_free
                        ? `<button type="button" class="btn-read" onclick="openPdfViewer('${safeTitle}', '${safeUrl}')">📖 Read In-App</button>
                           <a class="btn-dl" href="${links.downloadUrl || '#'}" target="_blank" rel="noopener">⬇️ Download</a>`
                        : `<a class="btn-buy" href="${waBuyLink}" target="_blank" rel="noopener">🔓 Unlock Note (₹${n.price}) →</a>`)
                  }
                </div>
              </article>
            `;
          }).join('')}
        </div>
      `;
    }

    loadNotes();
  </script>
  <script src="./app-shell.js"></script>
</body>
</html>
