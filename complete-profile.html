<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Complete Profile | Xtreme Exam</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0b0b0d;color:#fff;font-family:Arial,Helvetica,sans-serif;display:grid;place-items:center;padding:18px}
.card{width:min(500px,100%);background:#151519;border:1px solid #292930;border-radius:24px;padding:30px 24px;box-shadow:0 20px 70px rgba(0,0,0,.45)}
.mark{width:46px;height:46px;border:2px solid #d4af37;border-radius:13px;display:grid;place-items:center;color:#f5d76e;font-weight:900;margin-bottom:18px}
h1{margin:0 0 8px;font-size:28px}p{color:#aaa;line-height:1.5}
label{display:block;margin:18px 0 7px;font-size:14px;font-weight:700}
input{width:100%;padding:14px;border-radius:10px;border:1px solid #3a3a42;background:#0e0e11;color:#fff;font-size:16px}
button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:10px;background:#d4af37;color:#111;font-weight:800;font-size:16px;cursor:pointer}
button:disabled{opacity:.6}
.signout{background:transparent;color:#aaa;border:1px solid #3a3a42;margin-top:10px}
.err{display:none;margin-top:15px;color:#ffb0b0;background:#391818;border:1px solid #783333;padding:12px;border-radius:9px;font-size:14px;line-height:1.45}
.info{font-size:12px;color:#777;margin-top:16px}
</style>
</head>
<body>
<main class="card">
<div class="mark">X</div>
<h1>Complete your profile</h1>
<p>Just two details are required before entering Xtreme Exam.</p>

<form id="form">
<label for="name">Full Name</label>
<input id="name" required maxlength="100" autocomplete="name">

<label for="mobile">Mobile Number</label>
<input id="mobile" required inputmode="numeric" maxlength="10" pattern="[0-9]{10}" autocomplete="tel">

<div id="err" class="err"></div>
<button id="save" type="submit">Continue to Test Portal</button>
<button id="signout" class="signout" type="button">Sign Out</button>
<div class="info" id="accountInfo"></div>
</form>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabase = window.supabase.createClient(
  'https://vbfjafblxnrfminbdlbb.supabase.co',
  'sb_publishable_B1zX6LJONSD6icwsbHVmYg_z8qpprk9',
  {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}
);

const err = document.getElementById('err');
const nameInput = document.getElementById('name');

function showError(message) {
  err.textContent = message;
  err.style.display = 'block';
}

async function start() {
  const {data:{session},error} = await supabase.auth.getSession();

  if (error || !session) {
    location.replace('./auth.html');
    return;
  }

  const meta = session.user.user_metadata || {};
  nameInput.value = meta.full_name || meta.name || '';
  document.getElementById('accountInfo').textContent =
    'Signed in as ' + (session.user.email || 'Google account');
}

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  err.style.display = 'none';

  const name = nameInput.value.trim();
  const mobile = document.getElementById('mobile').value.trim();

  if (name.length < 2) {
    showError('Please enter your full name.');
    return;
  }

  if (!/^\d{10}$/.test(mobile)) {
    showError('Please enter a valid 10-digit mobile number.');
    return;
  }

  const btn = document.getElementById('save');
  btn.disabled = true;
  btn.textContent = 'Saving...';

  try {
    const {data:{session},error:sessionError} = await supabase.auth.getSession();
    if (sessionError || !session) throw new Error('Session expired. Please sign in again.');

    // IMPORTANT: is_admin is NOT supplied by the browser.
    // The SECURITY DEFINER RPC decides admin status from auth.email.
    const {data,error} = await supabase.rpc('complete_exam_profile', {
      _display_name: name,
      _mobile: mobile
    });

    if (error) throw error;
    if (data !== true) throw new Error('Profile could not be saved.');

    const email = (session.user.email || '').toLowerCase().trim();

    if (email === 'ajeetram3@gmail.com') {
      location.replace('./admin.html');
    } else {
      location.replace('./test-portal.html');
    }
  } catch (e) {
    console.error('Profile save error:', e);
    showError(e.message || 'Unable to save profile.');
    btn.disabled = false;
    btn.textContent = 'Continue to Test Portal';
  }
});

document.getElementById('signout').addEventListener('click', async () => {
  const btn = document.getElementById('signout');
  btn.disabled = true;
  try {
    await supabase.auth.signOut({scope:'local'});
  } finally {
    location.replace('./auth.html');
  }
});

start();
</script>
</body>
</html>
