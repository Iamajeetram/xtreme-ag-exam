<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Complete Profile | Xtreme Exam</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b0b0d;color:#fff;font-family:Arial,Helvetica,sans-serif;display:grid;place-items:center;padding:20px}
.card{width:min(500px,100%);background:#151519;border:1px solid #292930;border-radius:24px;padding:32px 24px;box-shadow:0 20px 70px #0008}
.mark{width:46px;height:46px;border:2px solid #d4af37;border-radius:13px;display:grid;place-items:center;color:#f5d76e;font-weight:900;margin-bottom:20px}
h1{margin:0 0 10px;font-size:30px}.sub{color:#aaa;line-height:1.55;margin:0 0 26px}
label{display:block;margin:18px 0 8px;font-weight:700;font-size:14px}
input{width:100%;padding:15px;border-radius:11px;border:1px solid #3a3a42;background:#0e0e11;color:#fff;font-size:16px;outline:none}
input:focus{border-color:#d4af37}
button{width:100%;margin-top:25px;padding:15px;border:0;border-radius:11px;background:#d4af37;color:#111;font-weight:800;font-size:16px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.error{display:none;margin-top:16px;padding:13px;border-radius:10px;background:#391818;border:1px solid #783333;color:#ffb8b8;font-size:14px;line-height:1.45;word-break:break-word}
.account{margin-top:18px;color:#777;font-size:12px}
</style>
</head>
<body>
<main class="card">
<div class="mark">X</div>
<h1>Complete your profile</h1>
<p class="sub">Just two details are required before entering Xtreme Exam.</p>
<form id="profileForm">
<label for="fullName">Full Name</label>
<input id="fullName" type="text" maxlength="100" autocomplete="name" required>
<label for="mobile">Mobile Number</label>
<input id="mobile" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel" required>
<div id="error" class="error"></div>
<button id="submitBtn" type="submit">Continue to Test Portal</button>
</form>
<div id="account" class="account"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://vbfjafblxnrfminbdlbb.supabase.co';
const SUPABASE_KEY='sb_publishable_B1zX6LJONSD6icwsbHVmYg_z8qpprk9';
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const form=document.getElementById('profileForm');
const nameInput=document.getElementById('fullName');
const mobileInput=document.getElementById('mobile');
const submitBtn=document.getElementById('submitBtn');
const errorBox=document.getElementById('error');
const accountBox=document.getElementById('account');

function showError(message){errorBox.textContent=message;errorBox.style.display='block';}

async function loadProfilePage(){
 try{
  const {data:{session},error}=await supabase.auth.getSession();
  if(error) throw error;
  if(!session?.user){window.location.replace('./auth.html');return;}
  const metadata=session.user.user_metadata||{};
  nameInput.value=metadata.full_name||metadata.name||'';
  accountBox.textContent='Signed in as '+(session.user.email||'Google account');
 }catch(error){showError(error.message||'Unable to load your account.');}
}

form.addEventListener('submit',async function(event){
 event.preventDefault();
 errorBox.style.display='none';
 const fullName=nameInput.value.trim();
 const mobile=mobileInput.value.trim();
 if(fullName.length<2){showError('Please enter your full name.');return;}
 if(!/^[0-9]{10}$/.test(mobile)){showError('Please enter a valid 10-digit mobile number.');return;}
 submitBtn.disabled=true;submitBtn.textContent='Saving...';
 try{
  const {data:{session},error:sessionError}=await supabase.auth.getSession();
  if(sessionError) throw sessionError;
  if(!session?.user){window.location.replace('./auth.html');return;}
  const {data,error}=await supabase.rpc('complete_exam_profile',{_display_name:fullName,_mobile:mobile});
  if(error) throw error;
  if(data!==true) throw new Error('Profile was not saved.');
  const email=(session.user.email||'').toLowerCase().trim();
  if(email==='ajeetram3@gmail.com') window.location.replace('./admin.html');
  else window.location.replace('./test-portal.html');
 }catch(error){
  console.error('Profile save error:',error);
  showError(error.message||'Unable to save your profile. Please try again.');
  submitBtn.disabled=false;submitBtn.textContent='Continue to Test Portal';
 }
});
loadProfilePage();
</script>
</body>
</html>
