<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Complete Profile | Xtreme Exam</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui;background:#fffaf0;color:#38251b;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(470px,100%);background:#fffdf8;border:1px solid #d9b77a;border-radius:22px;padding:30px 24px;box-shadow:0 14px 45px rgba(92,55,20,.12)}.motif{text-align:center;color:#a85d24;font-size:25px}h1{font:700 28px Georgia,serif;text-align:center;color:#7d3f1d;margin:8px 0}.sub{text-align:center;color:#795f4d;margin-bottom:24px}
label{display:block;font-weight:700;margin:15px 0 7px}input{width:100%;padding:13px;border:1px solid #cfae78;border-radius:11px;background:#fff;font-size:16px}button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:12px;background:#a85d24;color:white;font-size:16px;font-weight:800}#msg{text-align:center;margin-top:13px;color:#7d3f1d;min-height:22px}
</style></head><body><main class="card"><div class="motif">✦  ॐ  ✦</div><h1>Complete Your Profile</h1><div class="sub">बस दो जानकारी और आपका Xtreme Exam profile तैयार है</div>
<label>Full Name</label><input id="name" autocomplete="name" placeholder="Enter your full name">
<label>Mobile Number</label><input id="mobile" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number">
<button id="save">Continue to Test Portal</button><div id="msg"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabase=window.supabase.createClient("https://vbfjafblxnrfminbdlbb.supabase.co","sb_publishable_B1zX6LJONSD6icwsbHVmYg_z8qpprk9");
const msg=document.getElementById("msg");
async function init(){
 const {data:{session}}=await supabase.auth.getSession();
 if(!session){location.href="./auth.html";return}
 const {data:p}=await supabase.from("profiles").select("display_name,mobile,is_admin").eq("id",session.user.id).maybeSingle();
 document.getElementById("name").value=p?.display_name||session.user.user_metadata?.full_name||session.user.user_metadata?.name||"";
 if(p?.display_name && p?.mobile) route(p,session);
}
function route(p,s){
 const email=(s.user.email||"").toLowerCase().trim();
 location.href=(email==="ajeetram3@gmail.com"&&p.is_admin===true)?"./admin.html":"./test-portal.html";
}
document.getElementById("save").onclick=async()=>{
 const name=document.getElementById("name").value.trim(), mobile=document.getElementById("mobile").value.trim();
 if(name.length<2){msg.textContent="Please enter your full name";return}
 if(!/^[0-9]{10}$/.test(mobile)){msg.textContent="Please enter a valid 10-digit mobile number";return}
 msg.textContent="Saving profile...";
 const {error}=await supabase.rpc("complete_exam_profile",{_display_name:name,_mobile:mobile});
 if(error){msg.textContent=error.message;return}
 const {data:p,error:e}=await supabase.from("profiles").select("display_name,mobile,is_admin").eq("id",(await supabase.auth.getUser()).data.user.id).maybeSingle();
 if(e||!p?.display_name||!p?.mobile){msg.textContent=e?.message||"Profile save could not be verified.";return}
 route(p,(await supabase.auth.getSession()).data.session);
};
init();
</script></body></html>
