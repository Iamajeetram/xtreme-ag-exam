<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Complete Profile | Xtreme AG Apps</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f7fb;font-family:system-ui,sans-serif;color:#111827}.card{width:min(500px,100%);background:white;border:1px solid #e5e7eb;border-radius:24px;padding:30px;box-shadow:0 18px 60px #0f172a18}h1{margin:0 0 8px}p{color:#64748b}label{display:block;margin:18px 0 7px;font-weight:700;font-size:14px}input{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:10px;font-size:16px}button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:11px;background:#2563eb;color:white;font-size:16px;font-weight:800}button:disabled{opacity:.6}.email{margin-top:18px;padding:12px;background:#f8fafc;border-radius:10px;color:#475569;font-size:14px}.status{display:none;margin-top:16px;padding:12px;background:#fef2f2;color:#b91c1c;border-radius:10px;font-size:14px}</style></head><body>
<main class="card"><h1>Complete your profile</h1><p>First-time setup only. Your Google account is already verified.</p><div id="email" class="email">Loading...</div><form id="form"><label>Full Name</label><input id="name" autocomplete="name" required><label>Mobile Number</label><input id="mobile" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number" required><button id="save">Create Profile</button></form><div id="status" class="status"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const supabase=window.supabase.createClient("https://vbfjafblxnrfminbdlbb.supabase.co","sb_publishable_B1zX6LJONSD6icwsbHVmYg_z8qpprk9",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const status=document.getElementById("status");function error(m){status.textContent=m;status.style.display="block";}
async function init(){const {data:{session}}=await supabase.auth.getSession();if(!session){location.replace("./auth.html");return;}document.getElementById("email").textContent=session.user.email||"Google account";const m=session.user.user_metadata||{};document.getElementById("name").value=m.full_name||m.name||"";const {data:p}=await supabase.from("profiles").select("display_name,mobile").eq("id",session.user.id).maybeSingle();if(p){if(p.display_name)document.getElementById("name").value=p.display_name;if(p.mobile)document.getElementById("mobile").value=p.mobile;}}
document.getElementById("form").onsubmit=async e=>{e.preventDefault();const name=document.getElementById("name").value.trim(),mobile=document.getElementById("mobile").value.trim();if(name.length<2)return error("Please enter your full name.");if(!/^[0-9]{10}$/.test(mobile))return error("Please enter a valid 10-digit mobile number.");const b=document.getElementById("save");b.disabled=true;b.textContent="Saving...";const {data:{session}}=await supabase.auth.getSession();if(!session){location.replace("./auth.html");return;}const {data:p,error:pe}=await supabase.from("profiles").select("id,is_admin").eq("id",session.user.id).maybeSingle();if(pe){error(pe.message);b.disabled=false;b.textContent="Create Profile";return;}let r=p?await supabase.from("profiles").update({display_name:name,mobile,updated_at:new Date().toISOString()}).eq("id",session.user.id):await supabase.from("profiles").insert({id:session.user.id,display_name:name,mobile,is_admin:false,updated_at:new Date().toISOString()});if(r.error){error("Could not save profile: "+r.error.message);b.disabled=false;b.textContent="Create Profile";return;}location.replace(p&&p.is_admin===true?"./admin.html":"./test-portal.html");};
init();
</script></body></html>
